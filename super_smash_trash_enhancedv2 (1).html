<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Smash Trash</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 20%, #0c0a1a 0%, #030308 60%, #000000 100%);
      font-family: "Franklin Gothic Medium", "Arial Black", sans-serif;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #000000;
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>
  <script>
    'use strict';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let W = 1280, H = 720, DPR = 1;
    function resize() {
      DPR = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.imageSmoothingEnabled = false;
    }
    addEventListener('resize', resize); resize();

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const rand = (a, b) => a + Math.random() * (b - a);
    const hitRect = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    const keys = {}, pressed = {};
    const mouse = { x: 0, y: 0, click: false };
    addEventListener('keydown', e => { if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault(); if (!keys[e.code]) pressed[e.code] = true; keys[e.code] = true; });
    addEventListener('keyup', e => keys[e.code] = false);
    canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
    canvas.addEventListener('mousedown', () => mouse.click = true);

    class SoundSystem {
      constructor() { this.ctx = null; this.master = null; this.muted = false; this.beat = 0; this.timer = 0; }
      start() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.35; this.master.connect(this.ctx.destination);
      }
      toggle() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.35; }
      tone(f = 440, d = .1, type = 'sine', vol = .15, slide = 0) {
        this.start(); if (!this.ctx || this.muted) return;
        const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
        o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + .02);
      }
      noise(d = .08, vol = .12, filter = 900) {
        this.start(); if (!this.ctx || this.muted) return;
        const n = Math.floor(this.ctx.sampleRate * d), b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), data = b.getChannelData(0);
        for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
        const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
        s.buffer = b; f.type = 'bandpass'; f.frequency.value = filter; g.gain.value = vol;
        s.connect(f); f.connect(g); g.connect(this.master); s.start();
      }
      play(name) {
        if (name === 'select') this.tone(520, .06, 'triangle', .14, 120);
        if (name === 'jump') this.tone(320, .10, 'square', .12, 220);
        if (name === 'dash') this.noise(.05, .07, 450);
        if (name === 'hit') { this.tone(170, .08, 'sawtooth', .22, -50); this.noise(.08, .12, 1300); }
        if (name === 'heavy') { this.tone(85, .18, 'sawtooth', .32, -35); this.noise(.15, .18, 650); }
        if (name === 'special') this.tone(760, .12, 'triangle', .16, -240);
        if (name === 'ko') { this.tone(100, .25, 'sawtooth', .35, -55); this.noise(.25, .2, 240); }
        if (name === 'victory') { this.tone(330, .12, 'triangle', .18); setTimeout(() => this.tone(440, .12, 'triangle', .18), 120); setTimeout(() => this.tone(660, .28, 'triangle', .2), 240); }
        if (name === 'shield') this.tone(690, .08, 'sine', .14, -150);
        if (name === 'break') { this.tone(120, .4, 'sawtooth', .4, -80); this.noise(.5, .3, 200); }
      }
      update(dt) {
        this.start(); if (!this.ctx || this.muted) return;
      }
    }
    const audio = new SoundSystem();

    const characters = [
      { id: 'auron', name: 'Auron Vale', role: 'Balanced', color: '#45e5ff', dark: '#123e74', accent: '#fff06d', weapon: 'sword', speed: 380, air: 740, weight: 1, jump: 660, fall: 1450, scale: 1, recover: { lift: 770, drift: 1.0 }, desc: 'All-rounder. Strong vertical Up-B with steady air drift.' },
      { id: 'bront', name: 'Bront Keggar', role: 'Heavy', color: '#ff8848', dark: '#6b2515', accent: '#ffd56d', weapon: 'hammer', speed: 396, air: 792, weight: 1.38, jump: 640, fall: 1520, scale: 1.15, recover: { lift: 968, drift: 0.55 }, desc: 'Bruiser. Explosive vertical Up-B but poor horizontal recovery.' },
      { id: 'lyra', name: 'Lyra Flick', role: 'Fast', color: '#b35cff', dark: '#33145f', accent: '#74ffbd', weapon: 'blades', speed: 455, air: 905, weight: .86, jump: 700, fall: 1385, scale: .9, recover: { lift: 740, drift: 1.7 }, desc: 'Speed skater. Best air control and the widest Up-B recovery.' },
      { id: 'sable', name: 'Sable Orbit', role: 'Ranged', color: '#63ffda', dark: '#103f46', accent: '#ffea6b', weapon: 'staff', speed: 350, air: 730, weight: .96, jump: 640, fall: 1420, scale: 1, ranged: true, recover: { lift: 360, drift: 1.0, warp: 390 }, desc: 'Caster. Projectile zoning and a teleport blink Up-B recovery.' },
      { id: 'kessa', name: 'Kessa Dune', role: 'Duelist', color: '#ff5d6c', dark: '#5c1420', accent: '#ffe08a', weapon: 'rapier', speed: 392, air: 765, weight: .98, jump: 670, fall: 1440, scale: .98, recover: { lift: 860, drift: 1.5 }, desc: 'Precision duelist. Tipper stabs, combo lunge Side-B, drifting corkscrew Up-B.' },
      { id: 'dredge', name: 'Dredge Murn', role: 'Bulwark', color: '#9dff57', dark: '#1e4a12', accent: '#ffcf5e', weapon: 'anchor', speed: 369, air: 732, weight: 1.5, jump: 605, fall: 1600, scale: 1.22, recover: { lift: 968, drift: 0.605 }, desc: 'Trap grappler. Harpoon Neutral-B, sideways Tidal Toss, shockwave Down-B.' },
      { id: 'pip', name: 'Pip Quill', role: 'Skirmisher', color: '#ffd93b', dark: '#5a430f', accent: '#7dffef', weapon: 'fans', speed: 430, air: 880, weight: .80, jump: 720, fall: 1280, scale: .85, recover: { lift: 720, drift: 1.8 }, desc: 'Floaty trickster. Triple dazzle shots, wind-pull gale, free-action cyclone.' },
      { id: 'hex', name: 'Hex Marlowe', role: 'Hexblade', color: '#7d7dff', dark: '#1a1a4a', accent: '#ff7de9', weapon: 'scythe', speed: 362, air: 745, weight: 1.03, jump: 652, fall: 1430, scale: 1.04, recover: { lift: 380, drift: 1.0, warp: 360 }, desc: 'Risk-reward mage. Charge orb, returning sickle Side-B, damaging warp, hex zone.' }
    ];

    const moveNames = {
      jab: ['Pulse Jab', 'Anvil Tap', 'Pixel Poke', 'Scope Tap', 'Fleche Poke', 'Anchor Jab', 'Fan Flick', 'Hex Tap'],
      ftilt: ['Comet Cut', 'Forge Hook', 'Ribbon Swipe', 'Prism Staff', 'Crimson Lunge', 'Tide Sweep', 'Zephyr Fan', 'Soul Reap'],
      utilt: ['Sky Needle', 'Chimney Punch', 'Flip Spark', 'Orbit Rod', 'Sky Fleche', 'Barnacle Upper', 'Updraft Twirl', 'Grave Uptilt'],
      dtilt: ['Low Sweep', 'Quake Boot', 'Skim Kick', 'Low Signal', 'Low Fleche', 'Ballast Kick', 'Dust Skim', 'Cinder Sweep'],
      nair: ['Orbit Flash', 'Iron Spin', 'Glow Wheel', 'Halo Pulse', 'Blade Orbit', 'Chain Spin', 'Petal Wheel', 'Hex Orbit'],
      fair: ['Forward Glint', 'Meteor Elbow', 'Needle Heel', 'Lens Swipe', 'Riposte Slash', 'Harpoon Swing', 'Gale Slap', 'Reaper Swipe'],
      uair: ['Rising Arc', 'Smokestack', 'Neon Snip', 'Beacon Tap', 'Rising Fleche', 'Masthead', 'Thermal Snip', 'Wisp Upper'],
      dair: ['Star Drop', 'Falling Keg', 'Heel Drill', 'Falling Comet', 'Plunge Point', 'Anchor Drop', 'Dive Fan', 'Doom Drop'],
      nspec: ['Focus Thrust', 'Dynamo Punch', 'Paralyzer Shot', 'Blaster Shot', 'Piercing Fleche', 'Harpoon Throw', 'Dazzle Shot', 'Eldritch Bolt'],
      sspec: ['Pommel Bash', 'Seismic Toss', 'Gale Boomerang', 'Phantom Dash', 'Swift Lunge', 'Tidal Toss', 'Twin Gale', 'Soul Sickle'],
      uspec: ['Whirling Leap', 'Blazer Rising', 'Cannonball Launch', 'Recovery Launch', 'Spiral Ascent', 'Abyss Rising', 'Cyclone Lift', 'Soul Ascend'],
      dspec: ['Riposte', 'Tremor Stomp', 'Morph Dropper', 'Gravity Snare', 'Grand Riposte', 'Tremor Slam', 'Seed Pod', 'Hex Snare']
    };

    function makeMoves(char, i) {
      const balanceTable = [
        { mul: 1, quick: 1, kbm: 1, dash: 530 },       // 0 auron balanced
        { mul: 1.35, quick: 1.4, kbm: 1.22, dash: 420 }, // 1 bront heavy
        { mul: .85, quick: .65, kbm: .88, dash: 670 },   // 2 lyra fast
        { mul: .92, quick: 1, kbm: .96, dash: 530 },     // 3 sable ranged
        { mul: 1.0, quick: .95, kbm: 1.0, dash: 560 },   // 4 kessa duelist (precision, tipper rewards spacing)
        { mul: 1.38, quick: 1.5, kbm: 1.25, dash: 380 }, // 5 dredge trap-grappler (slow, high risk/reward)
        { mul: .80, quick: .60, kbm: .85, dash: 700 },   // 6 pip trickster (weak hits, best mobility + free cyclone)
        { mul: .95, quick: 1.05, kbm: .98, dash: 520 }   // 7 hex mage (charge orb, damaging warp, DOT zone)
      ];
      const bal = balanceTable[i] || balanceTable[0];
      const mul = bal.mul, quick = bal.quick, kbMul = bal.kbm, baseDash = bal.dash;
      const heavy = i === 1 || i === 5, fast = i === 2 || i === 6, ranged = i === 3 || i === 7;
      const mk = (kind, base, kb, ang, w, h, ox, oy, opts = {}) => ({ kind, name: moveNames[kind][i], startup: base.s * quick, s: base.s * quick, active: base.a, a: base.a, recovery: base.r * quick, r: base.r * quick, damage: Math.round(base.d * mul), d: Math.round(base.d * mul), kb: kb * kbMul, angle: ang, w: w * (char.scale), h: h * (char.scale), ox, oy, color: opts.color || char.accent, ...opts });

      let moves = {
        jab: mk('jab', { s: .055, a: .075, r: .14, d: 5 }, 310, -.2, 54, 34, 32, -38, { color: char.color }),
        ftilt: mk('ftilt', { s: .10, a: .11, r: .24, d: 8 }, 480, -.14, 82, 42, 42, -44, { color: char.accent }),
        utilt: mk('utilt', { s: .095, a: .11, r: .22, d: 9 }, 500, -1.35, 58, 78, -29, -96, { color: char.accent }),
        dtilt: mk('dtilt', { s: .075, a: .10, r: .19, d: 7 }, 390, .05, 78, 25, 36, -18, { color: char.color }),
        nair: mk('nair', { s: .07, a: .16, r: .24, d: 8 }, 440, -.7, 78, 62, -39, -63, { color: char.color }),
        fair: mk('fair', { s: .095, a: .12, r: .26, d: 9 }, 550, -.32, 84, 44, 42, -50, { color: char.accent }),
        uair: mk('uair', { s: .08, a: .12, r: .22, d: 8 }, 460, -1.45, 58, 80, -29, -102, { color: char.accent }),
        dair: mk('dair', { s: .13, a: .13, r: .33, d: 11 }, 580, 1.16, 56, 72, -28, -12, { color: char.color, meteor: true }),
        nspec: mk('nspec', { s: .13, a: .10, r: .32, d: 12 }, 650, -.22, 90, 56, 42, -55, { special: true, color: char.accent, projectile: ranged }),
        sspec: mk('sspec', { s: .08, a: .16, r: .35, d: 10 }, 580, -.12, 76, 48, 38, -48, { special: true, dash: baseDash, color: char.color }),
        uspec: mk('uspec', { s: .055, a: .17, r: .42, d: 9 }, 520, -1.25, 58, 88, -29, -105, { special: true, lift: char.recover.lift, warp: char.recover.warp, drift: char.recover.drift, color: char.accent }),
        dspec: mk('dspec', { s: .14, a: .13, r: .38, d: 13 }, 700, -.85, 90, 40, -45, -20, { special: true, color: char.accent })
      };

      if (i === 0) { // Auron
        moves.nspec.sweep = false; // Replaced with Focus Thrust
        moves.nspec.thrust = true;
        moves.nspec.w = 100; // Flattened/skinny hitbox
        moves.nspec.h = 30;
        moves.nspec.projectile = false;

        moves.sspec.pommelBash = true;
        moves.sspec.stunTime = 0.5;
        moves.sspec.d = 6;
        moves.sspec.kb = 200;
        moves.sspec.w = 45;
        moves.sspec.h = 45;
        moves.sspec.s = 0.05;
        moves.sspec.a = 0.08;
        moves.sspec.r = 0.15;
        moves.sspec.cooldown = 1.25;
        moves.sspec.dash = 0;

        moves.uspec.spin = true;
        moves.uspec.lift = 950;
        moves.uspec.w = 80;
        moves.uspec.h = 80;
        moves.uspec.d = Math.round(moves.uspec.d * 0.375); // Damage nerf

        moves.dspec.counter = true;
        moves.dspec.counterCooldown = 1.25;
      } else if (i === 1) { // Bront
        moves.nspec.charge = 2.5; // Decreased from 3.0
        moves.nspec.projectile = false;

        moves.sspec.seismicToss = true;
        moves.sspec.d = 14;
        moves.sspec.kb = 0; // Grab handles launch

        moves.uspec.helpless = true;
        moves.uspec.d = Math.round(moves.uspec.d * 0.75); // Damage nerf

        moves.dspec.aoe = true;
        moves.dspec.w = 120; // Extended radius
        moves.dspec.h = 50;

        const nerf = 0.7;
        moves.jab.d = Math.round(moves.jab.d * nerf);
        moves.ftilt.d = Math.round(moves.ftilt.d * nerf);
        moves.utilt.d = Math.round(moves.utilt.d * nerf);
        moves.dtilt.d = Math.round(moves.dtilt.d * nerf);
        moves.nair.d = Math.round(moves.nair.d * nerf);
        moves.fair.d = Math.round(moves.fair.d * nerf);
        moves.uair.d = Math.round(moves.uair.d * nerf);
        moves.dair.d = Math.round(moves.dair.d * nerf);
        moves.nspec.d = Math.round(moves.nspec.d * nerf);
        moves.sspec.d = Math.round(moves.sspec.d * nerf);
        moves.dspec.d = Math.round(moves.dspec.d * nerf);

        moves.jab.w = 45; moves.jab.h = 30;
        moves.ftilt.w = 60; moves.ftilt.h = 35;
        moves.utilt.w = 45; moves.utilt.h = 55;
        moves.dtilt.w = 60; moves.dtilt.h = 20;
        moves.nair.w = 60; moves.nair.h = 50;
        moves.fair.w = 65; moves.fair.h = 35;
        moves.uair.w = 45; moves.uair.h = 60;
        moves.dair.w = 45; moves.dair.h = 55;
        moves.nspec.w = 70; moves.nspec.h = 45;
        moves.sspec.w = 60; moves.sspec.h = 40;
        moves.dspec.w = 120; moves.dspec.h = 50;

      } else if (i === 2) { // Lyra
        moves.nspec.stun = true; moves.nspec.cooldown = 1.5; moves.nspec.projectile = true;
        moves.sspec.boomerang = true; moves.sspec.projectile = true; moves.sspec.dash = 0;
        moves.uspec.cannon = true;
        moves.dspec.bomb = true; moves.dspec.projectile = true;
      } else if (i === 3) { // Sable
        moves.sspec.phantomDash = 350; moves.sspec.dash = 0;
        moves.sspec.cooldown = 1.25;

        moves.nspec.projectile = true;
        moves.nspec.maxDist = 700; // Distance threshold
        moves.nspec.kb = 300;

        moves.uspec.cooldown = 1.5; // Strict 1.5s cooldown
        moves.uspec.lift = 360;

        moves.dspec.snare = true;
        moves.dspec.projectile = true;
        moves.dspec.cooldown = 1.0; // 1.0s cooldown
      } else if (i === 4) { // Kessa - precision duelist (UNIQUE: tipper + combo lunge + drifting corkscrew + dash riposte)
        moves.nspec.tipper = true; // sweetspot at tip: 12dmg/700kb tip vs 7dmg/450kb base
        moves.nspec.thrust = true;
        moves.nspec.w = 110;
        moves.nspec.h = 26;
        moves.nspec.projectile = false;
        moves.nspec.d = 7; moves.nspec.kb = 450;
        moves.nspec.tipDamage = 12; moves.nspec.tipKb = 700;
        moves.nspec.s = 0.11; moves.nspec.r = 0.26;

        moves.sspec.lunge = 260; // longer than before, low lag for combos
        moves.sspec.dash = 0;
        moves.sspec.w = 85; moves.sspec.h = 48;
        moves.sspec.d = 9; moves.sspec.kb = 480;
        moves.sspec.cooldown = 0.9;
        moves.sspec.lungeLag = 0.22; // combo-friendly (vs 0.4 default)

        moves.uspec.spin = true;
        moves.uspec.corkscrew = true; // drifts horizontally during rise
        moves.uspec.lift = 860;
        moves.uspec.drift = 1.5;
        moves.uspec.w = 86;
        moves.uspec.h = 86;
        moves.uspec.d = Math.round(moves.uspec.d * 0.375);

        moves.dspec.counter = true;
        moves.dspec.riposteDash = true; // teleports behind opponent on success
        moves.dspec.counterCooldown = 1.6;
        moves.dspec.counterWindow = 0.8; // longer read window, longer punish window
      } else if (i === 5) { // Dredge - trap grappler (UNIQUE: harpoon / side toss / armored rise / shockwave)
        moves.nspec.charge = 1.6;
        moves.nspec.harpoon = true; // chargeable heavy arc projectile (not melee)
        moves.nspec.projectile = true;
        moves.nspec.d = 9; moves.nspec.kb = 550;

        moves.sspec.seismicToss = true;
        moves.sspec.tossDir = 'side'; // horizontal slam (Bront is vertical)
        moves.sspec.d = 16;
        moves.sspec.kb = 0;

        moves.uspec.helpless = true;
        moves.uspec.armored = true; // superarmor: brief invuln on startup
        moves.uspec.armorTime = 0.25;
        moves.uspec.lift = 880;
        moves.uspec.w = 130; moves.uspec.h = 140; // widest rise
        moves.uspec.d = Math.round(moves.uspec.d * 0.75);

        moves.dspec.aoe = true;
        moves.dspec.shockwave = true; // spawns 2 ground waves
        moves.dspec.w = 125;
        moves.dspec.h = 52;

        const nerf = 0.7;
        moves.jab.d = Math.round(moves.jab.d * nerf);
        moves.ftilt.d = Math.round(moves.ftilt.d * nerf);
        moves.utilt.d = Math.round(moves.utilt.d * nerf);
        moves.dtilt.d = Math.round(moves.dtilt.d * nerf);
        moves.nair.d = Math.round(moves.nair.d * nerf);
        moves.fair.d = Math.round(moves.fair.d * nerf);
        moves.uair.d = Math.round(moves.uair.d * nerf);
        moves.dair.d = Math.round(moves.dair.d * nerf);
        moves.nspec.d = Math.round(moves.nspec.d * nerf);
        moves.sspec.d = Math.round(moves.sspec.d * nerf);
        moves.dspec.d = Math.round(moves.dspec.d * nerf);

        moves.jab.w = 48; moves.jab.h = 32;
        moves.ftilt.w = 64; moves.ftilt.h = 36;
        moves.utilt.w = 48; moves.utilt.h = 58;
        moves.dtilt.w = 64; moves.dtilt.h = 22;
        moves.nair.w = 64; moves.nair.h = 52;
        moves.fair.w = 68; moves.fair.h = 36;
        moves.uair.w = 48; moves.uair.h = 62;
        moves.dair.w = 48; moves.dair.h = 58;
        moves.nspec.w = 74; moves.nspec.h = 46;
        moves.sspec.w = 62; moves.sspec.h = 42;
        moves.dspec.w = 125; moves.dspec.h = 52;
      } else if (i === 6) { // Pip - floaty trickster (UNIQUE: skinny needles / wind-pull / free cyclone / bouncy pods)
        moves.nspec.spread = 3; // triple skinny needles
        moves.nspec.spreadAngle = 0.16;
        moves.nspec.stun = true; moves.nspec.stunTime = 0.25;
        moves.nspec.cooldown = 0.9; moves.nspec.projectile = true;
        moves.nspec.d = 3; moves.nspec.kb = 180;

        moves.sspec.boomerang = true; moves.sspec.gale = true; // wind-pull, short range
        moves.sspec.galeRange = 280; moves.sspec.pull = 5.5;
        moves.sspec.projectile = true; moves.sspec.dash = 0;
        moves.sspec.d = 5; moves.sspec.kb = 280;

        moves.uspec.cyclone = true; // NO helpless — can act after, low lift
        moves.uspec.lift = 720; moves.uspec.drift = 1.8;
        moves.uspec.d = 5;

        moves.dspec.bomb = true; moves.dspec.bouncy = true; // bounces twice, smaller linger
        moves.dspec.bounces = 2; moves.dspec.lingerTime = 0.5; moves.dspec.lingerR = 32;
        moves.dspec.projectile = true;
      } else if (i === 7) { // Hex - risk-reward mage (UNIQUE: charge orb / sickle throw / damaging warp / hex zone)
        moves.nspec.charge = 1.8;
        moves.nspec.chargeShot = true; // orb grows with charge, tap fires quick orb
        moves.nspec.projectile = true;
        moves.nspec.d = 7; moves.nspec.kb = 420;

        // NEW S-B: Soul Sickle — spinning scythe throw that goes out and returns
        moves.sspec.scytheSpin = true;
        moves.sspec.boomerang = true; // reuse return logic
        moves.sspec.scytheRange = 320;
        moves.sspec.projectile = true; moves.sspec.dash = 0;

        audio.play('ko'); g.cam.add(15);
        sparks(g, this.x, this.y - this.h / 2, this.char.color, this.face, 60);
        if (this.stocks <= 0) { this.respawn = 999; g.endCheck(); }
      }

      draw(c) {
        if (this.dead) return;
        c.save();
        if (this.invincible > 0 && Math.floor(this.invincible * 14) % 2 === 0) c.globalAlpha = .45;

        drawFighter(c, this, this.x, this.y);

        if (this.charging) {
          let ratio = clamp(this.chargeT / this.charging.charge, 0, 1);
          c.save();
          c.globalCompositeOperation = 'lighter';
          c.shadowBlur = 20 + ratio * 40;
          c.shadowColor = this.char.accent;
          c.strokeStyle = this.char.accent;
          c.lineWidth = 4;
          c.beginPath();
          c.arc(this.x, this.y - this.h / 2, 45 + ratio * 25, 0, Math.PI * 2 * ratio);
          c.stroke();

          // Bront Dynamo Punch UI & Flash + Dredge/Hex charge orbs
          if (this.char.id === 'bront') {
            c.beginPath();
            c.arc(0, 0, 35, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio);
            c.strokeStyle = '#ffd56d';
            c.lineWidth = 6;
            c.stroke();
            if (this.chargeT >= 2.5 && Math.floor(this.anim * 20) % 2 === 0) {
              c.fillStyle = 'rgba(255, 255, 255, 0.8)';
              c.beginPath(); c.arc(0, 0, 40, 0, Math.PI * 2); c.fill(); // Flash
            }
          } else if (this.charging && this.charging.harpoon) {
            // Dredge anchor winding: green arc + growing anchor icon
            c.strokeStyle = '#9dff57'; c.lineWidth = 6;
            c.beginPath(); c.arc(this.x, this.y - this.h / 2, 40 + ratio * 20, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio); c.stroke();
            c.fillStyle = '#9dff57';
            c.save(); c.translate(this.x + this.face * (26 + ratio * 12), this.y - this.h / 2); c.rotate(ratio * 2);
            c.fillRect(-10, -2.5, 20, 5); c.beginPath(); c.moveTo(10, -6); c.lineTo(16, 0); c.lineTo(10, 6); c.closePath(); c.fill();
            c.restore();
          } else if (this.charging && this.charging.chargeShot) {
            // Hex orb charging: pink orb grows
            const or = 10 + ratio * 12;
            c.fillStyle = '#ff7de9'; c.globalAlpha = 0.85;
            c.beginPath(); c.arc(this.x + this.face * 30, this.y - 52, or, 0, 6.28); c.fill();
            c.globalAlpha = 0.35; c.beginPath(); c.arc(this.x + this.face * 30, this.y - 52, or * 1.6, 0, 6.28); c.fill();
            c.globalAlpha = 1;
          }

          c.restore();
        }

        if (this.countering) {
          c.save();
          c.globalAlpha = 0.4 + Math.sin(this.anim * 40) * 0.4;
          c.fillStyle = '#ffffff';
          c.beginPath();
          c.arc(this.x, this.y - this.h / 2, 55, 0, 6.28);
          c.fill();
          c.restore();
        }

        if (this.isShielding && !this.shieldBroken) {
          c.save();
          c.strokeStyle = '#c9f8ff';
          c.lineWidth = 5;
          c.globalAlpha = 0.4 + (this.shieldHP / this.maxShieldHP) * 0.4;
          c.beginPath();
          c.arc(this.x, this.y - this.h / 2, this.h * 0.6, 0, 6.28);
          c.stroke();

          c.fillStyle = '#000';
          c.fillRect(this.x - 25, this.y - this.h - 15, 50, 6);
          c.fillStyle = this.shieldHP > 30 ? '#c9f8ff' : '#ff3333';
          c.fillRect(this.x - 25, this.y - this.h - 15, 50 * (this.shieldHP / this.maxShieldHP), 6);
          c.restore();
        }

        if (this.stunned) {
          c.save();
          c.fillStyle = '#ffff00';
          c.font = '900 28px "Franklin Gothic Medium", sans-serif';
          c.textAlign = 'center';
          c.shadowBlur = 10;
          c.shadowColor = '#ffff00';
          c.fillText('stunned', this.x, this.y - this.h - 30 + Math.sin(this.anim * 10) * 5);
          c.restore();
        }

        if (this.attack && this.atkT >= this.attack.startup && this.atkT <= this.attack.startup + this.attack.active && !this.attack.projectile) {
          const b = this.box();
          c.save();
          c.globalCompositeOperation = 'lighter';
          c.globalAlpha = .33;
          c.fillStyle = this.attack.color;
          roundRect(c, b.x, b.y, b.w, b.h, 12, true, false);
          c.strokeStyle = '#fff';
          c.lineWidth = 2;
          c.globalAlpha = .5;
          roundRect(c, b.x, b.y, b.w, b.h, 12, false, true);
          c.restore();
        }

        c.restore();
      }
    }

    function drawFighter(c, p, x, y) {
      const ch = p.char, s = ch.scale, f = p.face, t = p.anim;
      const isGrounded = p.ground;
      const isMoving = isGrounded && Math.abs(p.vx) > 50;
      const isAttacking = p.attack !== null;
      const hurt = (p.hitstun || 0) > 0;
      const phaseMap = { auron: 0, bront: 1.3, lyra: 2.6, sable: 3.9, kessa: 0.7, dredge: 2.0, pip: 3.2, hex: 4.5 };
      const phase = phaseMap[ch.id] !== undefined ? phaseMap[ch.id] : 0;

      const speed = isMoving ? 16 : 4;
      const cycle = t * speed;
      const breath = Math.sin(t * 5) * (isMoving ? 3 : 1);
      const swing = isMoving ? Math.sin(cycle) : 0;
      const airBlend = isGrounded ? 0 : clamp(p.vy / 800, -1, 1);
      const blinkCycle = (t * 0.55 + phase) % 4.2;
      const blinking = !hurt && (blinkCycle > 4.0 || blinkCycle < 0.06);

      c.save();
      c.translate(x, y + breath * s);
      c.scale(f, 1);

      c.fillStyle = 'rgba(0,0,0,0.5)';
      c.beginPath();
      c.ellipse(0, 5 - breath * s, (28 - Math.abs(airBlend) * 6) * s, 7 * s, 0, 0, Math.PI * 2);
      c.fill();

      c.scale(s, s);
      // Squash & stretch: rising fighters stretch tall, falling ones compress slightly wider
      const stretchY = isGrounded ? 1 : clamp(1 - airBlend * 0.14, 0.84, 1.14);
      const stretchX = isGrounded ? 1 : clamp(1 + airBlend * 0.10, 0.9, 1.12);
      c.scale(stretchX, stretchY);

      const drawLimb = (lx, ly, w, h, ang, color, detailColor) => {
        c.save(); c.translate(lx, ly); c.rotate(ang);
        c.fillStyle = color; roundRect(c, -w / 2, 0, w, h, w / 3, true, false);
        if (detailColor) {
          c.fillStyle = detailColor;
          c.fillRect(-w / 2 + 2, h - 12, w - 4, 8);
        }
        c.restore();
      };

      let backLegAng = isGrounded ? swing * 0.7 : 0.3 + airBlend * 0.4;
      let frontLegAng = isGrounded ? -swing * 0.7 : -0.2 + airBlend * 0.2;
      let backArmAng = isGrounded ? -swing * 0.9 : -2.5 - airBlend;
      let frontArmAng = isGrounded ? swing * 0.9 : -2.8 - airBlend;
      let armLength = 32;

      let atkProg = 0;
      if (isAttacking) {
        const at = p.attack;
        const total = at.startup + at.active + at.recovery;
        atkProg = clamp(p.atkT / total, 0, 1);
        if (atkProg > 0.08 && atkProg < 0.75) {
          frontArmAng = -Math.PI / 2 + (at.angle || 0) * 0.5;
          armLength = 45;
          // overhead moves raise the arm, low moves crouch it
          if (['utilt', 'uair', 'uspec'].includes(at.kind)) frontArmAng = -2.1 + (at.angle || 0) * 0.2;
          if (['dtilt', 'dair', 'dspec'].includes(at.kind)) frontArmAng = -0.7 + (at.angle || 0) * 0.3;
          if (at.kind === 'nair' || at.spin) frontArmAng = -1.4 + Math.sin(t * 22) * 0.5;
        }
      }

      const cMain = ch.color, cDark = ch.dark, cAcc = ch.accent;

      // Back extras (coat / hump / holsters) — drawn behind body, same flat style
      if (ch.id === 'kessa') {
        c.fillStyle = cDark;
        const sway = Math.sin(t * 3 + phase) * 3;
        c.beginPath(); c.moveTo(-10, -44); c.lineTo(-22 + sway, -12); c.lineTo(-8, -14); c.closePath(); c.fill();
        c.beginPath(); c.moveTo(10, -44); c.lineTo(22 - sway, -12); c.lineTo(8, -14); c.closePath(); c.fill();
      } else if (ch.id === 'dredge') {
        c.fillStyle = cDark;
        roundRect(c, -20, -74, 12, 30, 4, true, false); // anchor mount hump
        c.fillStyle = cMain;
        c.beginPath(); c.arc(-14, -74, 5, 0, 6.28); c.fill();
      } else if (ch.id === 'pip') {
        c.fillStyle = cDark;
        c.save(); c.translate(-14, -58); c.rotate(-0.5 + Math.sin(t * 2.5) * 0.08);
        c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 11, -1.0, 1.0); c.closePath(); c.fill();
        c.restore();
        c.save(); c.translate(14, -58); c.rotate(0.5 - Math.sin(t * 2.5) * 0.08);
        c.fillStyle = cMain;
        c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 11, -1.0, 1.0); c.closePath(); c.fill();
        c.restore();
      } else if (ch.id === 'hex') {
        c.fillStyle = cDark;
        c.beginPath(); c.moveTo(-12, -64); c.lineTo(-20, -88); c.lineTo(-8, -70); c.closePath(); c.fill();
        c.beginPath(); c.moveTo(12, -64); c.lineTo(20, -88); c.lineTo(8, -70); c.closePath(); c.fill();
      }

      drawLimb(2, -38, 12, ch.id === 'pip' ? 30 : 38, backLegAng, cDark);
      drawLimb(0, -62, 10, ch.id === 'pip' ? 26 : 32, backArmAng, cDark);

      c.fillStyle = cMain;
      c.beginPath();
      if (ch.id === 'bront') {
        c.moveTo(-22, -68); c.lineTo(22, -68);
        c.lineTo(14, -35); c.lineTo(-14, -35);
      } else if (ch.id === 'dredge') {
        // Massive riveted hull — wider and squarer than Bront
        c.moveTo(-26, -70); c.lineTo(26, -70);
        c.lineTo(18, -34); c.lineTo(-18, -34);
      } else if (ch.id === 'lyra') {
        c.moveTo(-10, -62); c.lineTo(16, -62);
        c.lineTo(8, -38); c.lineTo(-8, -38);
      } else if (ch.id === 'pip') {
        // Chibi round body
        c.moveTo(-14, -64); c.quadraticCurveTo(-16, -38, 0, -36); c.quadraticCurveTo(16, -38, 14, -64); c.closePath();
      } else if (ch.id === 'kessa') {
        // Slim duelist waist
        c.moveTo(-13, -67); c.lineTo(13, -67);
        c.lineTo(7, -52); c.lineTo(4, -44); c.lineTo(8, -36); c.lineTo(-8, -36); c.lineTo(-4, -44); c.lineTo(-7, -52);
        c.closePath();
      } else if (ch.id === 'hex') {
        // Tall lanky robe
        c.moveTo(-12, -72); c.lineTo(12, -72);
        c.lineTo(9, -36); c.lineTo(-9, -36);
        c.closePath();
      } else {
        c.moveTo(-16, -66); c.lineTo(16, -66);
        c.lineTo(10, -36); c.lineTo(-10, -36);
      }
      c.fill();
      // Torso details in same style
      if (ch.id === 'dredge') {
        c.fillStyle = cDark; c.beginPath(); c.moveTo(-10, -68); c.lineTo(10, -68); c.lineTo(0, -46); c.fill();
        c.fillStyle = 'rgba(0,0,0,.35)';
        c.beginPath(); c.arc(-16, -60, 2.2, 0, 6.28); c.arc(0, -58, 2.2, 0, 6.28); c.arc(16, -60, 2.2, 0, 6.28); c.fill();
        c.fillStyle = cAcc; c.fillRect(-18, -44, 36, 3);
      } else if (ch.id === 'pip') {
        c.fillStyle = cDark; c.beginPath(); c.arc(0, -52, 5, 0, 6.28); c.fill();
        c.fillStyle = cAcc; c.beginPath(); c.arc(-6, -46, 1.6, 0, 6.28); c.arc(6, -46, 1.6, 0, 6.28); c.fill();
      } else if (ch.id === 'kessa') {
        c.fillStyle = cDark; c.beginPath(); c.moveTo(-6, -67); c.lineTo(6, -67); c.lineTo(0, -50); c.fill();
        c.strokeStyle = cAcc; c.lineWidth = 1.6;
        c.beginPath(); c.moveTo(-11, -60); c.lineTo(-5, -48); c.moveTo(11, -60); c.lineTo(5, -48); c.stroke();
      } else if (ch.id === 'hex') {
        c.fillStyle = cDark; c.beginPath(); c.moveTo(-7, -72); c.lineTo(7, -72); c.lineTo(0, -48); c.fill();
        c.strokeStyle = cAcc; c.lineWidth = 1.4; c.globalAlpha = 0.8;
        c.beginPath(); c.moveTo(-9, -62); c.lineTo(9, -62); c.moveTo(-8, -54); c.lineTo(8, -54); c.stroke();
        c.globalAlpha = 1;
      } else {
        c.fillStyle = cDark;
        c.beginPath(); c.moveTo(-8, -66); c.lineTo(8, -66); c.lineTo(0, -45); c.fill();
      }

      c.shadowBlur = 12; c.shadowColor = cAcc;
      c.fillStyle = cAcc;
      c.beginPath(); c.arc(0, -56, 4, 0, Math.PI * 2); c.fill();
      c.shadowBlur = 0;

      c.save();
      c.translate(0, ch.id === 'pip' ? -64 : ch.id === 'hex' ? -72 : -68);
      c.rotate(isMoving ? 0.15 : Math.sin(t * 0.7 + phase) * 0.045);

      // Head base — same rounded-box language, different proportions per newcomer
      c.fillStyle = cDark;
      if (ch.id === 'dredge') roundRect(c, -14, -24, 28, 26, 9, true, false);
      else if (ch.id === 'pip') roundRect(c, -14, -24, 28, 26, 12, true, false);
      else if (ch.id === 'hex') roundRect(c, -11, -22, 22, 26, 7, true, false);
      else if (ch.id === 'kessa') roundRect(c, -11, -22, 22, 23, 8, true, false);
      else roundRect(c, -12, -22, 24, 24, 8, true, false);

      // Headgear / silhouettes (same flat style as Bront's fin, Sable's wedge)
      if (ch.id === 'kessa') {
        c.fillStyle = cDark;
        c.beginPath(); c.moveTo(-10, -20); c.lineTo(-22, -32 + Math.sin(t * 3) * 2); c.lineTo(-8, -26); c.closePath(); c.fill(); // ponytail
        c.fillStyle = cAcc; c.fillRect(-11, -24, 22, 2.5); // gold circlet
      } else if (ch.id === 'dredge') {
        c.fillStyle = cDark;
        c.beginPath(); c.moveTo(-14, -22); c.lineTo(-20, -32); c.lineTo(-8, -24); c.closePath(); c.fill();
        c.beginPath(); c.moveTo(14, -22); c.lineTo(20, -32); c.lineTo(8, -24); c.closePath(); c.fill();
        c.fillStyle = 'rgba(0,0,0,.4)';
        c.beginPath(); c.arc(-6, -26, 1.8, 0, 6.28); c.arc(6, -26, 1.8, 0, 6.28); c.fill(); // barnacles on brow
      } else if (ch.id === 'pip') {
        c.fillStyle = cMain;
        c.beginPath(); c.moveTo(-6, -22); c.lineTo(-10, -34); c.lineTo(-2, -24); c.closePath(); c.fill();
        c.beginPath(); c.moveTo(0, -23); c.lineTo(0, -36); c.lineTo(4, -23); c.closePath(); c.fill();
        c.beginPath(); c.moveTo(6, -22); c.lineTo(10, -34); c.lineTo(2, -24); c.closePath(); c.fill(); // feather tuft
      } else if (ch.id === 'hex') {
        c.fillStyle = cDark;
        c.beginPath(); c.moveTo(-11, -18); c.lineTo(-20, -34); c.lineTo(-9, -24); c.closePath(); c.fill();
        c.beginPath(); c.moveTo(11, -18); c.lineTo(20, -34); c.lineTo(9, -24); c.closePath(); c.fill(); // horns
        c.fillStyle = 'rgba(0,0,0,.45)'; roundRect(c, -11, -22, 22, 7, 3, true, false); // hood shadow
      }

      c.fillStyle = cMain;
      if (ch.id === 'sable') {
        c.beginPath(); c.moveTo(-18, -24); c.lineTo(18, -16); c.lineTo(0, 4); c.fill();
      } else if (ch.id === 'hex') {
        c.beginPath(); c.moveTo(-16, -22); c.lineTo(16, -15); c.lineTo(0, 3); c.fill();
      } else if (ch.id === 'pip') {
        roundRect(c, -12, -22, 24, 12, 6, true, false); // big cheek plate
      } else {
        roundRect(c, -10, -24, 20, 14, 6, true, false);
      }

      // Brow marks — abstract expression that reacts to combat state
      c.fillStyle = cDark;
      const browAngle = hurt ? 0.55 : isAttacking ? 0.32 : 0.06;
      c.save(); c.translate(-6, -18); c.rotate(browAngle + (ch.id === 'kessa' ? 0.12 : 0)); c.fillRect(-4.5, -1.4, 9, 2.6); c.restore();
      c.save(); c.translate(6, -18); c.rotate(-browAngle - (ch.id === 'kessa' ? 0.12 : 0)); c.fillRect(-4.5, -1.4, 9, 2.6); c.restore();

      // Visor "eye" strip — blinks, narrows when attacking, flares red when hurt
      c.shadowBlur = 15; c.shadowColor = hurt ? '#ff4747' : cAcc;
      c.fillStyle = hurt ? '#ff4747' : cAcc;
      if (blinking) {
        if (ch.id === 'bront' || ch.id === 'dredge') c.fillRect(4, -12.5, 6, 1.6);
        else roundRect(c, 0, -12.5, 12, 1.6, .8, true, false);
      } else if (ch.id === 'bront') {
        c.fillRect(4, -14, 6, 6);
      } else if (ch.id === 'dredge') {
        // cracked cyclops
        c.fillRect(2, -15, 9, 8);
        c.shadowBlur = 0; c.fillStyle = cDark; c.fillRect(5, -15, 1.6, 8);
        c.fillStyle = hurt ? '#ff4747' : cAcc;
      } else if (ch.id === 'hex') {
        // twin mage slits
        const ew = isAttacking ? 5 : 7;
        roundRect(c, -8.5, -14, ew, 4.5, 2, true, false);
        roundRect(c, 1.5, -14, ew, 4.5, 2, true, false);
      } else if (ch.id === 'pip') {
        // big round eyes
        c.beginPath(); c.arc(-4.5, -12, 3.2, 0, 6.28); c.arc(4.5, -12, 3.2, 0, 6.28); c.fill();
        c.shadowBlur = 0; c.fillStyle = cDark; c.beginPath(); c.arc(-4.5, -12, 1.3, 0, 6.28); c.arc(4.5, -12, 1.3, 0, 6.28); c.fill();
        c.fillStyle = hurt ? '#ff4747' : cAcc;
      } else if (ch.id === 'kessa') {
        c.save(); c.translate(6, -12); c.rotate(0.14); // slanted duelist slit
        const eyeW = isAttacking ? 8 : hurt ? 13 : 12;
        roundRect(c, -eyeW / 2, -2.5, eyeW, 5, 2, true, false);
        c.restore();
      } else {
        const eyeW = isAttacking ? 8 : hurt ? 13 : 12;
        roundRect(c, (12 - eyeW) / 2, -14, eyeW, 5, 2, true, false);
      }
      c.restore();
      c.shadowBlur = 0;

      c.fillStyle = cMain;
      if (ch.id === 'bront') roundRect(c, -8, -72, 18, 16, 6, true, false);
      else if (ch.id === 'dredge') roundRect(c, -10, -76, 22, 18, 6, true, false);
      else if (ch.id === 'kessa') { c.fillStyle = cAcc; c.beginPath(); c.arc(9, -70, 2, 0, 6.28); c.fill(); } // earring
      else if (ch.id === 'pip') { c.fillStyle = cAcc; c.beginPath(); c.arc(-10, -50, 2.2, 0, 6.28); c.arc(10, -50, 2.2, 0, 6.28); c.fill(); } // blush

      const legH = ch.id === 'pip' ? 30 : 40;
      drawLimb(-2, -38, 14, legH, frontLegAng, cMain, cAcc);
      drawLimb(0, -62, 12, armLength, frontArmAng, cMain, cAcc);

      // ---- WEAPONS + SWING ANIMATION ----
      // hand position in fighter-local space (matches drawLimb math)
      const baseAX = 0, baseAY = -62;
      const hx = baseAX - Math.sin(frontArmAng) * armLength;
      const hy = baseAY + Math.cos(frontArmAng) * armLength;
      const wid = ch.id || 'auron';
      const idleBase = { auron: -0.35, bront: 0.55, lyra: -0.15, sable: 0.25, kessa: -0.05, dredge: 0.65, pip: 0.1, hex: -0.3 }[wid] ?? -0.2;
      const weaponLen = { auron: 68, bront: 62, lyra: 44, sable: 72, kessa: 70, dredge: 66, pip: 40, hex: 74 }[wid] ?? 60;
      let weaponAngle = idleBase + Math.sin(t * 2 + phase) * 0.07;
      let thrustExt = 0;
      let isSpin = false;
      if (isAttacking) {
        const mv = p.attack;
        if (mv.kind === 'nair' || mv.spin) {
          isSpin = true;
          weaponAngle = t * 20;
        } else if (mv.thrust || mv.lunge || mv.beam) {
          weaponAngle = 0.04 + Math.sin(atkProg * 6.28) * 0.05;
          thrustExt = Math.sin(clamp(atkProg / 0.65, 0, 1) * Math.PI) * 24;
        } else {
          let swingCurve;
          if (atkProg < 0.3) { const k = atkProg / 0.3; swingCurve = lerp(0.25, -1.0, k * k); }
          else if (atkProg < 0.62) { swingCurve = lerp(-1.0, 1.15, (atkProg - 0.3) / 0.32); }
          else { swingCurve = lerp(1.15, 0.25, (atkProg - 0.62) / 0.38); }
          if (['utilt', 'uair', 'uspec'].includes(mv.kind)) weaponAngle = -1.15 + swingCurve * 0.95;
          else if (['dtilt', 'dair', 'dspec'].includes(mv.kind)) weaponAngle = 0.55 + swingCurve * 0.85;
          else weaponAngle = swingCurve * 1.0;
        }
      }
      // swing arc trail (behind weapon)
      if (isAttacking && atkProg > 0.18 && atkProg < 0.82) {
        c.save();
        c.translate(hx, hy);
        c.globalCompositeOperation = 'lighter';
        const trailA = isSpin ? 0.5 : 0.42 * Math.sin((atkProg - 0.18) / 0.64 * Math.PI);
        c.globalAlpha = clamp(trailA, 0, 0.55);
        c.strokeStyle = cAcc;
        c.shadowBlur = 16; c.shadowColor = cAcc;
        c.lineWidth = isSpin ? 7 : 9;
        c.beginPath();
        if (isSpin) { c.arc(0, 0, weaponLen * 0.85, 0, Math.PI * 2); }
        else {
          const kind = p.attack.kind;
          if (['utilt', 'uair', 'uspec'].includes(kind)) c.arc(0, 0, weaponLen * 0.9, -2.2, 0.4);
          else if (['dtilt', 'dair', 'dspec'].includes(kind)) c.arc(0, 0, weaponLen * 0.9, -0.4, 1.8);
          else c.arc(0, 0, weaponLen * 0.9, weaponAngle - 1.1, weaponAngle + 0.35);

    class Button {
      constructor(text, x, y, w, h, fn) { Object.assign(this, { text, x, y, w, h, fn }); }
      inside() { return mouse.x >= this.x && mouse.x <= this.x + this.w && mouse.y >= this.y && mouse.y <= this.y + this.h; }
      draw(c, sel) {
        const h = this.inside() || sel;
        c.save();
        c.shadowBlur = h ? 26 : 0;
        c.shadowColor = '#3bd66b';
        const g = c.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
        g.addColorStop(0, h ? '#1c6b46' : '#131318');
        g.addColorStop(1, h ? '#0a2c1d' : '#040406');
        c.fillStyle = g;
        roundRect(c, this.x, this.y, this.w, this.h, 10, true, false);
        // angled accent slice — reads as a designed UI element, not a stock gradient card
        c.save();
        roundRect(c, this.x, this.y, this.w, this.h, 10, false, false);
        c.clip();
        c.fillStyle = h ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.04)';
        c.beginPath();
        c.moveTo(this.x, this.y); c.lineTo(this.x + 22, this.y); c.lineTo(this.x, this.y + this.h); c.closePath(); c.fill();

        c.strokeStyle = h ? '#3bd66b' : 'rgba(255,255,255,.18)';
        c.lineWidth = h ? 2.5 : 1.5;
        roundRect(c, this.x, this.y, this.w, this.h, 10, false, true);
        c.fillStyle = '#fff';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.font = '900 24px "Franklin Gothic Medium", sans-serif';
        c.fillText(this.text, this.x + this.w / 2 + (h ? 3 : 0), this.y + this.h / 2 + 2);
        if (h) { c.fillStyle = '#3bd66b'; c.font = '900 20px "Franklin Gothic Medium", sans-serif'; c.fillText('▸', this.x + 26, this.y + this.h / 2 + 2); }
        c.restore();

        const blobs = [
          { c: '#3bd66b', x: .18, y: .22, r: .34 }, { c: '#7ee8ff', x: .82, y: .18, r: .30 },
          { c: '#a855f7', x: .5, y: .85, r: .40 }, { c: '#ff55df', x: .88, y: .78, r: .24 }
        ];
        blobs.forEach((b, i) => {
          const bx = W * b.x + Math.sin(this.time * .18 + i * 2) * 70;
          const by = H * b.y + Math.cos(this.time * .14 + i * 3) * 50;
          const rad = Math.max(1, Math.min(W, H) * b.r);
          const grd = ctx.createRadialGradient(bx, by, 0, bx, by, rad);
          grd.addColorStop(0, b.c + '22'); grd.addColorStop(1, b.c + '00');
          ctx.fillStyle = grd;
          ctx.fillRect(0, 0, W, H);
        });
        ctx.restore();

        // Angled speed-line grid for a designed, non-default feel
        ctx.save();
        ctx.globalAlpha = .05;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        const off = (this.time * 26) % 90;
        for (let i = -20; i < 40; i++) {
          ctx.beginPath();
          ctx.moveTo(i * 90 - off, H + 40);
          ctx.lineTo(i * 90 - off + H * .55, -40);
          ctx.stroke();
        }
        ctx.restore();

        // Floating trash-bin debris motes drifting upward
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 34; i++) {
          const seed = i * 91.7;
          const px = (seed * 3.1 + Math.sin(this.time * .3 + i) * 60) % (W + 80) - 40;
          const py = (H - ((this.time * (22 + (i % 5) * 6) + seed * 4) % (H + 80))) - 40;
          ctx.globalAlpha = .18 + .12 * Math.sin(this.time * 2 + i);
          ctx.fillStyle = i % 4 === 0 ? '#3bd66b' : i % 4 === 1 ? '#7ee8ff' : i % 4 === 2 ? '#ff55df' : '#a855f7';
          ctx.beginPath();
          ctx.arc(px, py, 1.5 + (i % 4), 0, 6.28);
          ctx.fill();
        }
        ctx.restore();

        // Vignette to frame the composition
        ctx.save();
        const vg = ctx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .25, W / 2, H * .45, Math.max(W, H) * .75);
        vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }
      draw() {
        ctx.clearRect(0, 0, W, H);
        if (this.state === 'match' || this.state === 'pause') {
          this.drawMatch();
          if (this.state === 'pause') this.drawPause();
        } else if (this.state === 'countdown') {
          this.drawCountdown();
        } else {
          this.bg();
          if (this.state === 'title') this.drawTitle();
          if (this.state === 'main') this.drawMain();
          if (this.state === 'controls') this.drawControls();
          if (this.state === 'credits') this.drawCredits();
          if (this.state === 'char') this.drawChar();
          if (this.state === 'stage') this.drawStageSelect();
          if (this.state === 'over') this.drawOver();
          this.buttons.forEach((b, i) => b.draw(ctx, i === this.menu));
        }
        if (this.stateTimer < 0.2) {
          ctx.fillStyle = `rgba(0,0,0,${1 - this.stateTimer / 0.2})`;
          ctx.fillRect(0, 0, W, H);
        }
      }
      drawTitle() {
        const pulse = 1.1 + Math.sin(this.time * 1.6) * .035;
        drawTrashCan(ctx, W / 2, H * .165, pulse, this.time);
        ctx.textAlign = 'center';
        const hue1 = '#3bd66b', hue2 = '#7ee8ff';
        // subtle chromatic offset flicker for a designed, energetic wordmark
        const jit = Math.sin(this.time * 9) > .96 ? 2 : 0;
        ctx.globalAlpha = .5; ctx.fillStyle = '#ff2fb0';
        ctx.font = '900 78px "Franklin Gothic Medium", sans-serif';
        ctx.fillText('SUPER SMASH', W / 2 + jit, H * .42);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#fff'; ctx.shadowColor = hue1; ctx.shadowBlur = 34 + Math.sin(this.time * 3) * 8;
        ctx.fillText('SUPER SMASH', W / 2, H * .42);
        ctx.shadowColor = hue2;
        ctx.fillText('TRASH', W / 2, H * .42 + 74);
        ctx.shadowBlur = 0;
        // animated accent underline
        const uw = 230 + Math.sin(this.time * 2) * 14;
        const ug = ctx.createLinearGradient(W / 2 - uw, 0, W / 2 + uw, 0);
        ug.addColorStop(0, 'transparent'); ug.addColorStop(.5, '#3bd66b'); ug.addColorStop(1, 'transparent');
        ctx.fillStyle = ug; ctx.fillRect(W / 2 - uw, H * .42 + 90, uw * 2, 3);
        ctx.font = '700 20px "Franklin Gothic Medium", sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fillText('Take out the trash. Last bin standing wins.', W / 2, H * .42 + 114);
        ctx.font = '700 13px "Franklin Gothic Medium", sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.32)';
        ctx.fillText((Math.sin(this.time * 2) > 0 ? 'PRESS ENTER' : '► PRESS ENTER ◄'), W / 2, H * .42 + 150);
      }
      drawMain() { drawTrashCan(ctx, W / 2, H * .085, .6, this.time); ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '900 54px "Franklin Gothic Medium", sans-serif'; ctx.shadowColor = '#3bd66b'; ctx.shadowBlur = 24; ctx.fillText('SUPER SMASH TRASH', W / 2, H * .21); ctx.shadowBlur = 0; ctx.font = '600 18px "Franklin Gothic Medium", sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.72)'; ctx.fillText('Knock the garbage past the blast zone. Three stocks. One bin.', W / 2, H * .27); }
      drawControls() {
        ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '900 42px "Franklin Gothic Medium", sans-serif'; ctx.fillText('CONTROLS', W / 2, 95);
        ctx.font = '700 18px "Franklin Gothic Medium", sans-serif';
        const lines = [
          'P1: A/D move, W jump, S fast fall, J attack, K special',
          'P1 Roll: Hold L (shield) + A/D + C',
          'P2: Arrow keys move, Up jump, Down fast fall',
          'P2 Roll: Hold Numpad 3/6 (shield) + Left/Right + Numpad 0',
          'Enter select, Escape pause/back, R restart, M mute',
          'Hold shield to block. Rolling cancels shield and grants brief invincibility.',
          'In the air, the dodge button air-dodges any direction — once per jump.',
          'Recovery: double jump, Up-special (each fighter is unique), or air-dodge to stage.',
          'Drift into a ledge to grab it. Up / toward = climb, Attack = get-up, Down / away = drop.'
        ];
        lines.forEach((l, i) => ctx.fillText(l, W / 2, 150 + i * 42));
      }
      drawCredits() { ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '900 42px "Franklin Gothic Medium", sans-serif'; ctx.fillText('CREDITS', W / 2, 115); ctx.font = '700 21px "Franklin Gothic Medium", sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.86)'; ctx.fillText('All characters, stages, sounds, music, UI, effects, and branding are original procedural content.', W / 2, 195); ctx.fillText('Built with HTML, CSS, JavaScript, Canvas API, and Web Audio API.', W / 2, 240); }
      drawChar() { ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '900 38px "Franklin Gothic Medium", sans-serif'; ctx.fillText('CHARACTER SELECT', W / 2, 52); ctx.font = '700 13px "Franklin Gothic Medium", sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillText('P1: A/D+W/S  •  P2: Arrows  •  C CPU  •  R random P1  •  P/O random P2/CPU  •  B both  •  8 fighters', W / 2, 76); const cw = Math.min(185, W / 5.8), ch = 208, gap = 12, cols = 4, sx = W / 2 - (cw * cols + gap * (cols - 1)) / 2; characters.forEach((chara, i) => { const col = i % cols, row = Math.floor(i / cols), x = sx + col * (cw + gap), y = 92 + row * (ch + gap), p1 = i === this.p1, p2 = i === this.p2; ctx.save(); const gr = ctx.createLinearGradient(x, y, x, y + ch); gr.addColorStop(0, chara.dark); gr.addColorStop(1, '#04060d'); ctx.fillStyle = gr; ctx.shadowColor = p1 || p2 ? chara.color : '#000'; ctx.shadowBlur = p1 || p2 ? 20 : 0; roundRect(ctx, x, y, cw, ch, 12, true, false); ctx.strokeStyle = p1 && p2 ? '#fff' : p1 ? '#42e8ff' : p2 ? '#ffdf6d' : 'rgba(255,255,255,.1)'; ctx.lineWidth = p1 || p2 ? 4 : 2; roundRect(ctx, x, y, cw, ch, 12, false, true); const fake = new Player(1, chara, x + cw / 2, y + 158, true); fake.anim = this.time; fake.ground = true; fake.vx = i % 2 ? 120 : 0; const demoMove = chara.moves.ftilt, demoTotal = demoMove.startup + demoMove.active + demoMove.recovery; fake.attack = demoMove; fake.atkT = (this.time * 0.7 + i * 0.35) % (demoTotal + 0.6); if (fake.atkT > demoTotal) fake.attack = null; drawFighter(ctx, fake, x + cw / 2, y + 158); ctx.fillStyle = '#fff'; ctx.font = '900 16px "Franklin Gothic Medium", sans-serif'; ctx.fillText(chara.name, x + cw / 2, y + 24); ctx.font = '800 13px "Franklin Gothic Medium", sans-serif'; ctx.fillStyle = chara.accent; ctx.fillText(chara.role + ' • ' + (chara.weapon || ''), x + cw / 2, y + 42); ctx.font = '600 11px "Franklin Gothic Medium", sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.72)'; wrap(ctx, chara.desc, x + cw / 2, y + 58, cw - 20, 14); ctx.font = '900 13px "Franklin Gothic Medium", sans-serif'; if (p1) { ctx.fillStyle = '#42e8ff'; ctx.fillText('P1', x + 24, y + ch - 12); } if (p2) { ctx.fillStyle = '#ffdf6d'; ctx.fillText(this.cpu ? 'CPU' : 'P2', x + cw - 26, y + ch - 12); } ctx.restore(); }); }
      drawStageSelect() { ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '900 42px "Franklin Gothic Medium", sans-serif'; ctx.fillText('STAGE SELECT', W / 2, 72); const st = stages[this.stageI], sw = Math.min(660, W * .68), sh = 330, x = W / 2 - sw / 2, y = 155; ctx.save(); roundRect(ctx, x, y, sw, sh, 16, true, false); ctx.clip(); ctx.translate(x + sw / 2, y + sh / 2 + 45); ctx.scale(.34, .34); this.drawStageWorld(st, null); ctx.restore(); ctx.strokeStyle = st.accent; ctx.lineWidth = 5; roundRect(ctx, x, y, sw, sh, 16, false, true); ctx.fillStyle = '#fff'; ctx.font = '900 34px "Franklin Gothic Medium", sans-serif'; ctx.fillText(st.name, W / 2, y + sh + 52); ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '700 17px "Franklin Gothic Medium", sans-serif'; ctx.fillText(st.desc, W / 2, y + sh + 83); }
      drawCountdown() {
        this.cam.apply(ctx);
        this.drawStageWorld(this.stage, this.cam);
        ctx.restore();
        ctx.fillStyle = 'rgba(0,0,0,.6)';
        ctx.fillRect(0, 0, W, H);
        const countdown = Math.ceil(this.countdownTimer);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.font = `900 ${Math.max(120, 200 - countdown * 20)}px "Franklin Gothic Medium", sans-serif`;
        ctx.shadowColor = '#3bd66b';
        ctx.shadowBlur = 40;
        ctx.fillText(countdown, W / 2, H / 2);
        ctx.shadowBlur = 0;
      }
      drawOver() { ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '900 52px "Franklin Gothic Medium", sans-serif'; ctx.fillText('VICTORY', W / 2, 92); if (this.winner) { ctx.fillStyle = this.winner.char.accent; ctx.font = '900 34px "Franklin Gothic Medium", sans-serif'; ctx.fillText('PLAYER ' + this.winner.id + ' WINS', W / 2, 142); const fake = new Player(this.winner.id, this.winner.char, W / 2, 405, true); fake.anim = this.time; fake.ground = true; drawFighter(ctx, fake, W / 2, 420); ctx.fillStyle = '#fff'; ctx.font = '900 32px "Franklin Gothic Medium", sans-serif'; ctx.fillText(this.winner.char.name, W / 2, 235); } }

      drawStageWorld(st, cam) {
        const px = cam ? cam.x : 0;
        const py = cam ? cam.y : 0;
        ctx.save();
        const g = ctx.createLinearGradient(0, -800, 0, 650);
        g.addColorStop(0, st.bg[0]); g.addColorStop(1, st.bg[1]);
        ctx.fillStyle = g;
        ctx.translate(px * 0.8, py * 0.6);
        ctx.fillRect(-3000, -2000, 6000, 4000);
        ctx.restore();
        ctx.save();
        ctx.translate(px * 0.4, py * 0.2);
        ctx.globalAlpha = .28; ctx.globalCompositeOperation = 'lighter';
        for (let i = -12; i <= 12; i++) {
          ctx.fillStyle = st.accent;
          if (st.name.includes('Neon')) ctx.fillRect(i * 180 + Math.sin(i) * 40, -380 + (i * i % 8) * 55, 80, 880);
          else { ctx.beginPath(); ctx.arc(i * 220 + Math.sin(this.time + i) * 30, -380 + Math.cos(i) * 70, 55 + (i % 4) * 14, 0, 6.28); ctx.fill(); }
        }
        ctx.restore();
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const glow = ctx.createRadialGradient(0, 0, 100, 0, 0, 900);
        glow.addColorStop(0, st.accent + '33');
        glow.addColorStop(1, 'transparent');
        ctx.fillStyle = glow;
        ctx.fillRect(-1500, -800, 3000, 1600);
        ctx.restore();
        st.platforms.forEach(p => {
          const gr = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
          gr.addColorStop(0, st.accent); gr.addColorStop(1, p.main ? '#09090b' : 'rgba(255,255,255,.1)');
          ctx.fillStyle = gr; roundRect(ctx, p.x, p.y, p.w, p.h, 8, true, false);
          ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; roundRect(ctx, p.x, p.y, p.w, p.h, 8, false, true);
        });
      }

      drawMatch() {
        this.cam.apply(ctx);
        this.drawStageWorld(this.stage, this.cam);

        this.tempHitboxes.forEach(hb => {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = 0.4;
          ctx.fillStyle = hb.color;
          roundRect(ctx, hb.x, hb.y, hb.w, hb.h, 8, true, false);
          ctx.restore();
        });

        if (this.gravityZone) {
          let gz = this.gravityZone;
          const gzCol = gz.hex ? '#ff7de9' : '#63ffda';
          ctx.save();
          ctx.globalAlpha = 0.3 + Math.sin(this.time * 5) * 0.1;
          ctx.fillStyle = gzCol;
          ctx.shadowBlur = 20;
          ctx.shadowColor = gzCol;
          ctx.beginPath();
          ctx.arc(gz.x, gz.y, gz.r, 0, Math.PI * 2);
          ctx.fill();
          if (gz.hex) {
            ctx.globalAlpha = 0.6 + Math.sin(this.time * 7) * 0.2;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(gz.x, gz.y, gz.r * 0.7, this.time * 1.5, this.time * 1.5 + 4.2); ctx.stroke();
            ctx.beginPath(); ctx.arc(gz.x, gz.y, gz.r * 0.45, -this.time * 2, -this.time * 2 + 3.6); ctx.stroke();
          }
          ctx.restore();
        }

        this.floatingTexts.forEach(ft => {
          ctx.save();
          ctx.globalAlpha = Math.min(1, ft.life * 2);
          ctx.fillStyle = ft.color;
          ctx.font = '900 28px "Franklin Gothic Medium", sans-serif';
          ctx.textAlign = 'center';
          ctx.shadowBlur = 10;
          ctx.shadowColor = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        });

        this.projectiles.forEach(p => p.draw(ctx));
        this.particles.forEach(p => p.draw(ctx));
        this.players.forEach(p => p.draw(ctx));
        ctx.restore();
        this.hud();
      }
      hud() {
        const draw = (p, x) => {
          ctx.save();
          const panelG = ctx.createLinearGradient(x, H - 112, x, H - 24);
          panelG.addColorStop(0, '#111116'); panelG.addColorStop(1, '#020203');
          ctx.fillStyle = panelG; ctx.globalAlpha = 0.9;
          roundRect(ctx, x, H - 112, 350, 88, 12, true, false); ctx.globalAlpha = 1;
          const danger = p.damage > 100;
          ctx.strokeStyle = p.char.color; ctx.lineWidth = danger ? 3 + Math.sin(this.time * 10) * 1 : 3;
          ctx.shadowColor = p.char.color; ctx.shadowBlur = danger ? 14 : 0;
          roundRect(ctx, x, H - 112, 350, 88, 12, false, true);
          ctx.shadowBlur = 0;
          ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = '900 20px "Franklin Gothic Medium", sans-serif';
          ctx.fillText((p.cpu ? 'CPU ' : 'P' + p.id + ' ') + p.char.name, x + 82, H - 84);
          ctx.font = '900 36px "Franklin Gothic Medium", sans-serif';
          ctx.fillStyle = p.damage > 120 ? '#ef4444' : p.damage > 70 ? '#f59e0b' : '#fff';
          ctx.shadowBlur = 12; ctx.shadowColor = ctx.fillStyle;
          ctx.fillText(Math.floor(p.damage) + '%', x + 82, H - 44);
          ctx.shadowBlur = 0;
          for (let i = 0; i < 3; i++) {
            ctx.globalAlpha = i < p.stocks ? 1 : .2; ctx.fillStyle = p.char.accent;
            ctx.shadowBlur = i < p.stocks ? 8 : 0; ctx.shadowColor = p.char.accent;
            ctx.beginPath(); ctx.arc(x + 24 + i * 22, H - 49, 7, 0, 6.28); ctx.fill();
          }
          ctx.globalAlpha = 1; ctx.shadowBlur = 0;
          const f = new Player(p.id, p.char, x + 42, H - 35, true); f.anim = this.time; f.ground = true;
          drawFighter(ctx, f, x + 42, H - 35); ctx.restore();
        };
        draw(this.players[0], 32); draw(this.players[1], W - 382);
        ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '700 14px "Franklin Gothic Medium", sans-serif';
        ctx.fillText('Esc Pause  •  R Restart  •  M Mute' + (audio.muted ? '  •  MUTED' : ''), W / 2, 30);
      }
      drawPause() { ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '900 56px "Franklin Gothic Medium", sans-serif'; ctx.fillText('PAUSED', W / 2, H * .32);['RESUME', 'RESTART', 'MAIN MENU'].forEach((o, i) => { ctx.fillStyle = i === this.pause ? '#a855f7' : 'rgba(255,255,255,.85)'; ctx.font = '900 28px "Franklin Gothic Medium", sans-serif'; ctx.fillText(o, W / 2, H * .44 + i * 66); }); }
    }
    function wrap(c, text, x, y, max, lineH) { const words = text.split(' '); let line = ''; for (const w of words) { const test = line + w + ' '; if (c.measureText(test).width > max && line) { c.fillText(line, x, y); line = w + ' '; y += lineH; } else line = test; } c.fillText(line, x, y); }
    new Game();
  </script>
