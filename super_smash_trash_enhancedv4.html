<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 20%, #0c0a1a 0%, #030308 60%, #000000 100%);
      font-family: "Franklin Gothic Medium", "Arial Black", sans-serif;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #000000;
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>
  <script>
    'use strict';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let W = 1280, H = 720, DPR = 1;
    function resize() {
      DPR = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.imageSmoothingEnabled = false;
    }
    addEventListener('resize', resize); resize();

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const rand = (a, b) => a + Math.random() * (b - a);
    const hitRect = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    const keys = {}, pressed = {};
    const mouse = { x: 0, y: 0, click: false };
    addEventListener('keydown', e => { if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault(); if (!keys[e.code]) pressed[e.code] = true; keys[e.code] = true; });
    addEventListener('keyup', e => keys[e.code] = false);
    canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
    canvas.addEventListener('mousedown', () => mouse.click = true);

    class SoundSystem {
      constructor() { this.ctx = null; this.master = null; this.muted = false; this.beat = 0; this.timer = 0; }
      start() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.35; this.master.connect(this.ctx.destination);
      }
      toggle() { this.muted = !this.muted; if (this.master) this.master.gain.value = this.muted ? 0 : 0.35; }
      tone(f = 440, d = .1, type = 'sine', vol = .15, slide = 0) {
        this.start(); if (!this.ctx || this.muted) return;
        const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
        o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + .02);
      }
      noise(d = .08, vol = .12, filter = 900) {
        this.start(); if (!this.ctx || this.muted) return;
        const n = Math.floor(this.ctx.sampleRate * d), b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), data = b.getChannelData(0);
        for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
        const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
        s.buffer = b; f.type = 'bandpass'; f.frequency.value = filter; g.gain.value = vol;
        s.connect(f); f.connect(g); g.connect(this.master); s.start();
      }
      play(name) {
        if (name === 'select') this.tone(520, .06, 'triangle', .14, 120);
        if (name === 'jump') this.tone(320, .10, 'square', .12, 220);
        if (name === 'dash') this.noise(.05, .07, 450);
        if (name === 'hit') { this.tone(170, .08, 'sawtooth', .22, -50); this.noise(.08, .12, 1300); }
        if (name === 'heavy') { this.tone(85, .18, 'sawtooth', .32, -35); this.noise(.15, .18, 650); }
        if (name === 'special') this.tone(760, .12, 'triangle', .16, -240);
        if (name === 'ko') { this.tone(100, .25, 'sawtooth', .35, -55); this.noise(.25, .2, 240); }
        if (name === 'victory') { this.tone(330, .12, 'triangle', .18); setTimeout(() => this.tone(440, .12, 'triangle', .18), 120); setTimeout(() => this.tone(660, .28, 'triangle', .2), 240); }
        if (name === 'shield') this.tone(690, .08, 'sine', .14, -150);
        if (name === 'break') { this.tone(120, .4, 'sawtooth', .4, -80); this.noise(.5, .3, 200); }
      }
      update(dt) {
        this.start(); if (!this.ctx || this.muted) return;
      }
    }
    const audio = new SoundSystem();

    const characters = [
      { id: 'auron', name: 'Auron Vale', role: 'Balanced', color: '#45e5ff', dark: '#123e74', accent: '#fff06d', weapon: 'sword', speed: 380, air: 740, weight: 1, jump: 660, fall: 1450, scale: 1, recover: { lift: 770, drift: 1.0 }, desc: 'All-rounder. Strong vertical Up-B with steady air drift.' },
      { id: 'bront', name: 'Bront Keggar', role: 'Heavy', color: '#ff8848', dark: '#6b2515', accent: '#ffd56d', weapon: 'hammer', speed: 396, air: 792, weight: 1.38, jump: 640, fall: 1520, scale: 1.15, recover: { lift: 968, drift: 0.55 }, desc: 'Bruiser. Explosive vertical Up-B but poor horizontal recovery.' },
      { id: 'lyra', name: 'Lyra Flick', role: 'Fast', color: '#b35cff', dark: '#33145f', accent: '#74ffbd', weapon: 'blades', speed: 455, air: 905, weight: .86, jump: 700, fall: 1385, scale: .9, recover: { lift: 740, drift: 1.7 }, desc: 'Speed skater. Best air control and the widest Up-B recovery.' },
      { id: 'sable', name: 'Sable Orbit', role: 'Ranged', color: '#63ffda', dark: '#103f46', accent: '#ffea6b', weapon: 'staff', speed: 350, air: 730, weight: .96, jump: 640, fall: 1420, scale: 1, ranged: true, recover: { lift: 360, drift: 1.0, warp: 390 }, desc: 'Caster. Projectile zoning and a teleport blink Up-B recovery.' },
      { id: 'kessa', name: 'Kessa Dune', role: 'Duelist', color: '#ff5d6c', dark: '#5c1420', accent: '#ffe08a', weapon: 'rapier', speed: 392, air: 765, weight: .98, jump: 670, fall: 1440, scale: .98, recover: { lift: 860, drift: 1.5 }, desc: 'Precision duelist. Tipper stabs, combo lunge Side-B, drifting corkscrew Up-B.' },
      { id: 'dredge', name: 'Dredge Murn', role: 'Bulwark', color: '#9dff57', dark: '#1e4a12', accent: '#ffcf5e', weapon: 'anchor', speed: 369, air: 732, weight: 1.5, jump: 605, fall: 1600, scale: 1.22, recover: { lift: 968, drift: 0.605 }, desc: 'Trap grappler. Harpoon Neutral-B, sideways Tidal Toss, shockwave Down-B.' },
      { id: 'pip', name: 'Pip Quill', role: 'Skirmisher', color: '#ffd93b', dark: '#5a430f', accent: '#7dffef', weapon: 'fans', speed: 430, air: 880, weight: .80, jump: 720, fall: 1280, scale: .85, recover: { lift: 720, drift: 1.8 }, desc: 'Floaty trickster. Triple dazzle shots, wind-pull gale, free-action cyclone.' },
      { id: 'hex', name: 'Hex Marlowe', role: 'Hexblade', color: '#7d7dff', dark: '#1a1a4a', accent: '#ff7de9', weapon: 'scythe', speed: 362, air: 745, weight: 1.03, jump: 652, fall: 1430, scale: 1.04, recover: { lift: 380, drift: 1.0, warp: 360 }, desc: 'Risk-reward mage. Charge orb, returning sickle Side-B, damaging warp, hex zone.' },
      { id: 'sol', name: 'Sol Pyre', role: 'Dawnwarden', color: '#ffb02e', dark: '#5a2a0c', accent: '#fff3a0', weapon: 'lance', speed: 385, air: 780, weight: 1.02, jump: 665, fall: 1440, scale: 1, recover: { lift: 750, drift: 1.2 }, desc: 'Dawn warden. Mortar sunspots, trail rush, diving Up-B, blinding flash.' },
      { id: 'nox', name: 'Nox Umbra', role: 'Duskwarden', color: '#4d7cff', dark: '#0c1440', accent: '#9be8ff', weapon: 'crescent', speed: 395, air: 800, weight: .94, jump: 675, fall: 1400, scale: .98, recover: { lift: 820, drift: 1.35 }, desc: 'Dusk warden. Frost seals, tether pull, spiking rise, delayed mine.' },
      { id: 'volt', name: 'Volt Kaito', role: 'Striker', color: '#e8ff00', dark: '#3d4400', accent: '#00f0ff', weapon: 'coil', speed: 410, air: 840, weight: .92, jump: 680, fall: 1400, scale: .97, recover: { lift: 780, drift: 1.4 }, desc: 'Rail striker. Hitscan beam, dash-through surge, storm rise, overclock buff.' },
      { id: 'mira', name: 'Mira Bloom', role: 'Warden', color: '#2eff8a', dark: '#0a3d24', accent: '#ff7ab8', weapon: 'bloom', speed: 375, air: 820, weight: .95, jump: 690, fall: 1320, scale: .96, recover: { lift: 700, drift: 1.7 }, desc: 'Bloom warden. Thorn lob trap, vine self-pull, petal float, healing pollen.' },
      { id: 'rook', name: 'Rook Bastion', role: 'Sentinel', color: '#ff3355', dark: '#4a1210', accent: '#ffb800', weapon: 'cannon', speed: 360, air: 720, weight: 1.45, jump: 610, fall: 1580, scale: 1.18, recover: { lift: 880, drift: 0.65 }, desc: 'Siege sentinel. Heavy siege ball, armored charge, jet slam, aegis dome.' },
      { id: 'juno', name: 'Juno Circuit', role: 'Runner', color: '#00c2ff', dark: '#0a2a4a', accent: '#ff4dd8', weapon: 'orbitals', speed: 425, air: 870, weight: .88, jump: 700, fall: 1350, scale: .94, recover: { lift: 740, drift: 1.6 }, desc: 'Drone runner. Homing spark, mine-layer dash, rocket hover, gun turret.' },
      { id: 'onyx', name: 'Onyx Wraith', role: 'Shade', color: '#ff00e5', dark: '#2a0a33', accent: '#9dff00', weapon: 'claws', speed: 400, air: 810, weight: .90, jump: 675, fall: 1410, scale: .97, recover: { lift: 400, drift: 1.0, warp: 380 }, desc: 'Shadow wraith. Blink slash, fade dash, free shadow step, smoke veil.' }
    ];

    const moveNames = {
      jab: ['Pulse Jab', 'Anvil Tap', 'Pixel Poke', 'Scope Tap', 'Fleche Poke', 'Anchor Jab', 'Fan Flick', 'Hex Tap', 'Dawn Jab', 'Dusk Jab', 'Volt Jab', 'Bloom Jab', 'Bastion Jab', 'Circuit Jab', 'Wraith Jab'],
      ftilt: ['Comet Cut', 'Forge Hook', 'Ribbon Swipe', 'Prism Staff', 'Crimson Lunge', 'Tide Sweep', 'Zephyr Fan', 'Soul Reap', 'Sunbrand', 'Moonslice', 'Arc Cut', 'Vine Lash', 'Siege Hook', 'Orbit Swipe', 'Claw Rake'],
      utilt: ['Sky Needle', 'Chimney Punch', 'Flip Spark', 'Orbit Rod', 'Sky Fleche', 'Barnacle Upper', 'Updraft Twirl', 'Grave Uptilt', 'Helios Arc', 'Lunar Horn', 'Spark Upper', 'Petal Upper', 'Piston Upper', 'Thruster Upper', 'Mist Upper'],
      dtilt: ['Low Sweep', 'Quake Boot', 'Skim Kick', 'Low Signal', 'Low Fleche', 'Ballast Kick', 'Dust Skim', 'Cinder Sweep', 'Ember Trip', 'Shade Trip', 'Ground Spark', 'Root Trip', 'Tread Sweep', 'Slide Kick', 'Shade Sweep'],
      nair: ['Orbit Flash', 'Iron Spin', 'Glow Wheel', 'Halo Pulse', 'Blade Orbit', 'Chain Spin', 'Petal Wheel', 'Hex Orbit', 'Corona Spin', 'Umbral Wheel', 'Surge Orbit', 'Spore Wheel', 'Hull Spin', 'Drone Orbit', 'Veil Spin'],
      fair: ['Forward Glint', 'Meteor Elbow', 'Needle Heel', 'Lens Swipe', 'Riposte Slash', 'Harpoon Swing', 'Gale Slap', 'Reaper Swipe', 'Daybreak Swipe', 'Nightfall Swipe', 'Coil Swipe', 'Thorn Slash', 'Ram Swing', 'Rotor Swipe', 'Phantom Claw'],
      uair: ['Rising Arc', 'Smokestack', 'Neon Snip', 'Beacon Tap', 'Rising Fleche', 'Masthead', 'Thermal Snip', 'Wisp Upper', 'Sunrise Upper', 'Moonrise Upper', 'Tesla Upper', 'Bloom Upper', 'Flak Upper', 'Jet Upper', 'Gloom Upper'],
      dair: ['Star Drop', 'Falling Keg', 'Heel Drill', 'Falling Comet', 'Plunge Point', 'Anchor Drop', 'Dive Fan', 'Doom Drop', 'Noon Drop', 'Midnight Drop', 'Arc Drop', 'Seed Drop', 'Anvil Drop', 'Descent Drop', 'Night Drop'],
      nspec: ['Focus Thrust', 'Dynamo Punch', 'Paralyzer Shot', 'Blaster Shot', 'Piercing Fleche', 'Harpoon Throw', 'Dazzle Shot', 'Eldritch Bolt', 'Sunspot Mortar', 'Moonshard Throw', 'Rail Beam', 'Thorn Lob', 'Siege Ball', 'Homing Spark', 'Shadow Slash'],

      dspec: ['Riposte', 'Tremor Stomp', 'Morph Dropper', 'Gravity Snare', 'Grand Riposte', 'Tremor Slam', 'Seed Pod', 'Hex Snare', 'Flash Snare', 'Grave Seal', 'Overclock', 'Pollen Heal', 'Aegis Dome', 'Turret Deploy', 'Smoke Veil']
    };

    function makeMoves(char, i) {
      const balanceTable = [
        { mul: 1, quick: 1, kbm: 1, dash: 530 },       // 0 auron balanced
        { mul: 1.35, quick: 1.4, kbm: 1.22, dash: 420 }, // 1 bront heavy
        { mul: .85, quick: .65, kbm: .88, dash: 670 },   // 2 lyra fast
        { mul: .92, quick: 1, kbm: .96, dash: 530 },     // 3 sable ranged
        { mul: 1.0, quick: .95, kbm: 1.0, dash: 560 },   // 4 kessa duelist (precision, tipper rewards spacing)
        { mul: 1.38, quick: 1.5, kbm: 1.25, dash: 380 }, // 5 dredge trap-grappler (slow, high risk/reward)
        { mul: .80, quick: .60, kbm: .85, dash: 700 },   // 6 pip trickster (weak hits, best mobility + free cyclone)
        { mul: .95, quick: 1.05, kbm: .98, dash: 520 },   // 7 hex mage (charge orb, damaging warp, DOT zone)
        { mul: 1.0, quick: 1.0, kbm: 1.0, dash: 500 },   // 8 sol dawnwarden (balanced zone control, pulsing traps)
        { mul: .95, quick: 1.0, kbm: .97, dash: 540 },   // 9 nox duskwarden (weaker hits, faster drift + slow traps)
        { mul: 1.0, quick: .9, kbm: 1.0, dash: 560 },   // 10 volt striker (hitscan beam, pierce surge)
        { mul: .92, quick: 1.0, kbm: .95, dash: 520 },   // 11 mira warden (lob trap, self-pull vine)
        { mul: 1.3, quick: 1.35, kbm: 1.2, dash: 400 }, // 12 rook sentinel (slow heavy ball, armored charge)
        { mul: .88, quick: .85, kbm: .9, dash: 620 },   // 13 juno runner (homing spark, hover + turret)
        { mul: .98, quick: .95, kbm: 1.0, dash: 560 }   // 14 onyx wraith (blink slash, fade dash, free warp)
      ];
      const bal = balanceTable[i] || balanceTable[0];
      const mul = bal.mul, quick = bal.quick, kbMul = bal.kbm, baseDash = bal.dash;
      const heavy = i === 1 || i === 5, fast = i === 2 || i === 6, ranged = i === 3 || i === 7;
      const mk = (kind, base, kb, ang, w, h, ox, oy, opts = {}) => ({ kind, name: moveNames[kind][i], startup: base.s * quick, s: base.s * quick, active: base.a, a: base.a, recovery: base.r * quick, r: base.r * quick, damage: Math.round(base.d * mul), d: Math.round(base.d * mul), kb: kb * kbMul, angle: ang, w: w * (char.scale), h: h * (char.scale), ox, oy, color: opts.color || char.accent, ...opts });

      let moves = {
        jab: mk('jab', { s: .055, a: .075, r: .14, d: 5 }, 310, -.2, 54, 34, 32, -38, { color: char.color }),
        ftilt: mk('ftilt', { s: .10, a: .11, r: .24, d: 8 }, 480, -.14, 82, 42, 42, -44, { color: char.accent }),
        utilt: mk('utilt', { s: .095, a: .11, r: .22, d: 9 }, 500, -1.35, 58, 78, -29, -96, { color: char.accent }),
        dtilt: mk('dtilt', { s: .075, a: .10, r: .19, d: 7 }, 390, .05, 78, 25, 36, -18, { color: char.color }),
        nair: mk('nair', { s: .07, a: .16, r: .24, d: 8 }, 440, -.7, 78, 62, -39, -63, { color: char.color }),
        fair: mk('fair', { s: .095, a: .12, r: .26, d: 9 }, 550, -.32, 84, 44, 42, -50, { color: char.accent }),
        uair: mk('uair', { s: .08, a: .12, r: .22, d: 8 }, 460, -1.45, 58, 80, -29, -102, { color: char.accent }),
        dair: mk('dair', { s: .13, a: .13, r: .33, d: 11 }, 580, 1.16, 56, 72, -28, -12, { color: char.color, meteor: true }),
        nspec: mk('nspec', { s: .13, a: .10, r: .32, d: 12 }, 650, -.22, 90, 56, 42, -55, { special: true, color: char.accent, projectile: ranged }),
        sspec: mk('sspec', { s: .08, a: .16, r: .35, d: 10 }, 580, -.12, 76, 48, 38, -48, { special: true, dash: baseDash, color: char.color }),
        uspec: mk('uspec', { s: .055, a: .17, r: .42, d: 9 }, 520, -1.25, 58, 88, -29, -105, { special: true, lift: char.recover.lift, warp: char.recover.warp, drift: char.recover.drift, color: char.accent }),
        dspec: mk('dspec', { s: .14, a: .13, r: .38, d: 13 }, 700, -.85, 90, 40, -45, -20, { special: true, color: char.accent })
      };

      if (i === 0) { // Auron
        moves.nspec.sweep = false; // Replaced with Focus Thrust
        moves.nspec.thrust = true;
        moves.nspec.w = 100; // Flattened/skinny hitbox
        moves.nspec.h = 30;
        moves.nspec.projectile = false;

        moves.sspec.pommelBash = true;
        moves.sspec.stunTime = 0.5;
        moves.sspec.d = 6;
        moves.sspec.kb = 200;
        moves.sspec.w = 45;
        moves.sspec.h = 45;
        moves.sspec.s = 0.05;
        moves.sspec.a = 0.08;
        moves.sspec.r = 0.15;
        moves.sspec.cooldown = 1.25;
        moves.sspec.dash = 0;

        moves.uspec.spin = true;
        moves.uspec.lift = 950;
        moves.uspec.w = 80;
        moves.uspec.h = 80;
        moves.uspec.d = Math.round(moves.uspec.d * 0.375); // Damage nerf
        moves.uspec.a = 0.35; // Extended active so rising hits guarantee damage

        moves.dspec.counter = true;
        moves.dspec.counterCooldown = 1.25;
      } else if (i === 1) { // Bront
        moves.nspec.charge = 2.5; // Decreased from 3.0
        moves.nspec.projectile = false;

        moves.sspec.d = 14;
        moves.sspec.kb = 0; // Grab handles launch

        moves.uspec.helpless = true;
        moves.uspec.d = Math.round(moves.uspec.d * 0.75); // Damage nerf

        moves.dspec.aoe = true;
        moves.dspec.w = 120; // Extended radius
        moves.dspec.h = 50;

        const nerf = 0.7;
        moves.jab.d = Math.round(moves.jab.d * nerf);
        moves.ftilt.d = Math.round(moves.ftilt.d * nerf);
        moves.utilt.d = Math.round(moves.utilt.d * nerf);
        moves.dtilt.d = Math.round(moves.dtilt.d * nerf);
        moves.nair.d = Math.round(moves.nair.d * nerf);
        moves.fair.d = Math.round(moves.fair.d * nerf);
        moves.uair.d = Math.round(moves.uair.d * nerf);
        moves.dair.d = Math.round(moves.dair.d * nerf);
        moves.nspec.d = Math.round(moves.nspec.d * nerf);
        moves.sspec.d = Math.round(moves.sspec.d * nerf);

        moves.ftilt.w = 60; moves.ftilt.h = 35;
        moves.utilt.w = 45; moves.utilt.h = 55;
        moves.dtilt.w = 60; moves.dtilt.h = 20;
        moves.nair.w = 60; moves.nair.h = 50;
        moves.fair.w = 65; moves.fair.h = 35;
        moves.uair.w = 45; moves.uair.h = 60;
        moves.dair.w = 45; moves.dair.h = 55;
        moves.nspec.w = 70; moves.nspec.h = 45;
        moves.sspec.w = 60; moves.sspec.h = 40;
        moves.dspec.w = 120; moves.dspec.h = 50;
        moves.sspec.d = 15; // Heavy side-special standardized to 15 dmg

      } else if (i === 2) { // Lyra
        moves.nspec.stun = true; moves.nspec.cooldown = 1.5; moves.nspec.projectile = true;
        moves.sspec.boomerang = true; moves.sspec.projectile = true; moves.sspec.dash = 0;
        moves.uspec.cannon = true;
        moves.dspec.bomb = true; moves.dspec.projectile = true;
      } else if (i === 3) { // Sable
        moves.sspec.phantomDash = 350; moves.sspec.dash = 0;
        moves.sspec.cooldown = 1.25;

        moves.nspec.projectile = true;
        moves.nspec.maxDist = 700; // Distance threshold
        moves.nspec.kb = 300;

        moves.uspec.cooldown = 1.5; // Strict 1.5s cooldown
        moves.uspec.lift = 360;

        moves.dspec.snare = true;
        moves.dspec.projectile = true;
        moves.dspec.cooldown = 1.0; // 1.0s cooldown
      } else if (i === 4) { // Kessa - precision duelist (UNIQUE: tipper + combo lunge + drifting corkscrew + dash riposte)
        moves.nspec.tipper = true; // sweetspot at tip: 12dmg/700kb tip vs 7dmg/450kb base
        moves.nspec.thrust = true;
        moves.nspec.w = 110;
        moves.nspec.h = 26;
        moves.nspec.projectile = false;
        moves.nspec.d = 7; moves.nspec.kb = 450;
        moves.nspec.tipDamage = 12; moves.nspec.tipKb = 700;
        moves.nspec.s = 0.11; moves.nspec.r = 0.26;

        moves.sspec.lunge = 260; // longer than before, low lag for combos
        moves.sspec.dash = 0;
        moves.sspec.w = 85; moves.sspec.h = 48;
        moves.sspec.d = 9; moves.sspec.kb = 480;
        moves.sspec.cooldown = 0.9;
        moves.sspec.lungeLag = 0.22; // combo-friendly (vs 0.4 default)
        moves.sspec.pierce = true; // pierce through opponent, no mobility stop

        moves.uspec.spin = true;
        moves.uspec.corkscrew = true; // drifts horizontally during rise
        moves.uspec.lift = 860;

    class Button {
      constructor(text, x, y, w, h, fn) { Object.assign(this, { text, x, y, w, h, fn }); }
      inside() { return mouse.x >= this.x && mouse.x <= this.x + this.w && mouse.y >= this.y && mouse.y <= this.y + this.h; }
      draw(c, sel) {
        const h = this.inside() || sel;
        c.save();
        c.shadowBlur = h ? 26 : 0;
        c.shadowColor = '#3bd66b';
        const g = c.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
        g.addColorStop(0, h ? '#1c6b46' : '#131318');
        g.addColorStop(1, h ? '#0a2c1d' : '#040406');
        c.fillStyle = g;
        roundRect(c, this.x, this.y, this.w, this.h, 10, true, false);
        // angled accent slice — reads as a designed UI element, not a stock gradient card
        c.save();
        roundRect(c, this.x, this.y, this.w, this.h, 10, false, false);
        c.clip();
        c.fillStyle = h ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.04)';
        c.beginPath();
        c.moveTo(this.x, this.y); c.lineTo(this.x + 22, this.y); c.lineTo(this.x, this.y + this.h); c.closePath(); c.fill();
        c.restore();
        c.strokeStyle = h ? '#3bd66b' : 'rgba(255,255,255,.18)';
        c.lineWidth = h ? 2.5 : 1.5;
        roundRect(c, this.x, this.y, this.w, this.h, 10, false, true);
        c.fillStyle = '#fff';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.font = '900 24px "Franklin Gothic Medium", sans-serif';
        c.fillText(this.text, this.x + this.w / 2 + (h ? 3 : 0), this.y + this.h / 2 + 2);
        if (h) { c.fillStyle = '#3bd66b'; c.font = '900 20px "Franklin Gothic Medium", sans-serif'; c.fillText('▸', this.x + 26, this.y + this.h / 2 + 2); }
        c.restore();
      }
    }

            } else if (t.kind === 'turret') {
              ctx.globalAlpha = 0.95 * fade;
              ctx.fillStyle = '#0a2a4a'; ctx.strokeStyle = '#ff4dd8'; ctx.lineWidth = 2.5;
              ctx.shadowBlur = 16; ctx.shadowColor = '#ff4dd8';
              ctx.beginPath(); ctx.arc(t.x, t.y - 10, 13, 0, 6.28); ctx.fill(); ctx.stroke();
              ctx.fillStyle = '#00c2ff';
              const ta = Math.sin(this.time * 4 + t.x) * 0.4;
              ctx.save(); ctx.translate(t.x, t.y - 10); ctx.rotate(ta);
              ctx.fillRect(0, -3, 18, 6);
              ctx.restore();
              ctx.shadowBlur = 0;
            } else if (t.kind === 'smoke') {
              ctx.globalAlpha = 0.4 * fade; ctx.fillStyle = '#3a3a4a';
              ctx.shadowBlur = 0;
              ctx.beginPath(); ctx.arc(t.x, t.y, (t.r || 110) * 0.9, 0, 6.28); ctx.fill();
              ctx.globalAlpha = 0.5 * fade; ctx.strokeStyle = '#9dff00'; ctx.lineWidth = 2;
              ctx.setLineDash([8, 8]);
              ctx.beginPath(); ctx.arc(t.x, t.y, (t.r || 110) * 0.7, this.time * 0.8, this.time * 0.8 + 5.2); ctx.stroke();
              ctx.setLineDash([]);
            }
            ctx.restore();
          }
        }

        this.floatingTexts.forEach(ft => {
          ctx.save();
          ctx.globalAlpha = Math.min(1, ft.life * 2);
          ctx.fillStyle = ft.color;
          ctx.font = '900 28px "Franklin Gothic Medium", sans-serif';
          ctx.textAlign = 'center';
          ctx.shadowBlur = 10;
          ctx.shadowColor = ft.color;
          ctx.fillText(ft.text, ft.x, ft.y);
          ctx.restore();
        });

        this.projectiles.forEach(p => p.draw(ctx));
        this.particles.forEach(p => p.draw(ctx));
        this.players.forEach(p => p.draw(ctx));
        ctx.restore();
        this.hud();
      }
      hud() {
        const draw = (p, x) => {
          ctx.save();
          const panelG = ctx.createLinearGradient(x, H - 112, x, H - 24);
          panelG.addColorStop(0, '#111116'); panelG.addColorStop(1, '#020203');
          ctx.fillStyle = panelG; ctx.globalAlpha = 0.9;
          roundRect(ctx, x, H - 112, 350, 88, 12, true, false); ctx.globalAlpha = 1;
          const danger = p.damage > 100;
          ctx.strokeStyle = p.char.color; ctx.lineWidth = danger ? 3 + Math.sin(this.time * 10) * 1 : 3;
          ctx.shadowColor = p.char.color; ctx.shadowBlur = danger ? 14 : 0;
          roundRect(ctx, x, H - 112, 350, 88, 12, false, true);
          ctx.shadowBlur = 0;
          ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = '900 20px "Franklin Gothic Medium", sans-serif';
          ctx.fillText((p.cpu ? 'CPU ' : 'P' + p.id + ' ') + p.char.name, x + 82, H - 84);
          ctx.font = '900 36px "Franklin Gothic Medium", sans-serif';
          ctx.fillStyle = p.damage > 120 ? '#ef4444' : p.damage > 70 ? '#f59e0b' : '#fff';
          ctx.shadowBlur = 12; ctx.shadowColor = ctx.fillStyle;
          ctx.fillText(Math.floor(p.damage) + '%', x + 82, H - 44);
          ctx.shadowBlur = 0;
          for (let i = 0; i < (p.maxStocks || 3); i++) {
            ctx.globalAlpha = i < p.stocks ? 1 : .2; ctx.fillStyle = p.char.accent;
            ctx.shadowBlur = i < p.stocks ? 8 : 0; ctx.shadowColor = p.char.accent;
            ctx.beginPath(); ctx.arc(x + 24 + i * 22, H - 49, 7, 0, 6.28); ctx.fill();
          }
          ctx.globalAlpha = 1; ctx.shadowBlur = 0;
          const f = new Player(p.id, p.char, x + 42, H - 35, true); f.anim = this.time; f.ground = true;
          drawFighter(ctx, f, x + 42, H - 35); ctx.restore();
        };
        draw(this.players[0], 32); draw(this.players[1], W - 382);
        ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '700 14px "Franklin Gothic Medium", sans-serif';
        ctx.fillText('Esc Pause  •  R Restart  •  M Mute' + (audio.muted ? '  •  MUTED' : ''), W / 2, 30);
        if (this.suddenDeath) {
          ctx.textAlign = 'center'; ctx.font = '900 26px "Franklin Gothic Medium", sans-serif';
          ctx.fillStyle = Math.sin(this.time * 8) > 0 ? '#ef4444' : '#fff';
          ctx.shadowBlur = 14; ctx.shadowColor = '#ef4444';
          ctx.fillText('SUDDEN DEATH', W / 2, 58); ctx.shadowBlur = 0;
          if (this.sdAnnounce > 0) { ctx.font = '900 64px "Franklin Gothic Medium", sans-serif'; ctx.fillStyle = '#ef4444'; ctx.shadowBlur = 24; ctx.shadowColor = '#ef4444'; ctx.fillText('SUDDEN DEATH!', W / 2, H / 2 - 60); ctx.shadowBlur = 0; }
        } else if (this.timeLimit > 0) {
          const t = Math.max(0, this.timeLimit - this.matchTime);
          ctx.textAlign = 'center'; ctx.font = '900 24px "Franklin Gothic Medium", sans-serif';
          ctx.fillStyle = t < 30 ? '#ef4444' : '#fff';
          ctx.fillText(Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'), W / 2, 58);
        }
      }
      drawPause() { ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = '900 56px "Franklin Gothic Medium", sans-serif'; ctx.fillText('PAUSED', W / 2, H * .32);['RESUME', 'RESTART', 'MAIN MENU'].forEach((o, i) => { ctx.fillStyle = i === this.pause ? '#a855f7' : 'rgba(255,255,255,.85)'; ctx.font = '900 28px "Franklin Gothic Medium", sans-serif'; ctx.fillText(o, W / 2, H * .44 + i * 66); }); }
    }
    function wrap(c, text, x, y, max, lineH) { const words = text.split(' '); let line = ''; for (const w of words) { const test = line + w + ' '; if (c.measureText(test).width > max && line) { c.fillText(line, x, y); line = w + ' '; y += lineH; } else line = test; } c.fillText(line, x, y); }
    new Game();
  </script>
